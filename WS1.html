<!DOCTYPE html>
<html lang="en">


<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Smart 1 — MCQ Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;family=Noto+Sans+Bengali:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root {
  /* Base Theme */
  --bg: #0b0d12;
  --card: #161a23;
  --ink: #e8ecf3;
  --muted: #8a93a6;

  /* Accent & Structure */
  --title-blue: #7c9fe0;
  --line: #232938;

  /* MCQ Option Styling */
  --opt-border: #2a3142;
  --opt-bg: #1c2130;
  --opt-hover: #252c3d;

  /* Feedback Colors */
  --ok: #4ade80;
  --ok-bg: rgba(74, 222, 128, 0.12);
  --bad: #f87171;
  --bad-bg: rgba(248, 113, 113, 0.12);

  /* Buttons */
  --btn: #5f7f8e;
  --btn-hover: #7a9aab;
  --accent: #4ade80;
}


  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    font-family:'Baloo 2','Hind Siliguri','Noto Sans Bengali','Sutonny MJ','SolaimanLipi','Nirmala UI',system-ui,sans-serif;
    color:var(--ink); min-height:100vh; padding:24px 14px 60px;
  }
  .wrap{max-width:720px;margin:0 auto}
  .card{
    background:var(--card); border-radius:18px; padding:28px 30px 34px;
    box-shadow:0 6px 24px rgba(30,50,80,.08);
  }
  .site-title{text-align:center;color:var(--title-blue);font-weight:800;font-size:26px;letter-spacing:.2px}
  .dash{border:none;border-top:2px dashed var(--line);margin:16px 0 22px}
  /* ---- Set list ---- */
  .sets-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:6px}
  .sets-head h2{font-size:22px;font-weight:700}
  .overall{font-size:14px;color:var(--muted)}
  .progress-track{height:10px;background:#eef1f5;border-radius:6px;overflow:hidden;margin:10px 0 20px}
  .progress-fill{height:100%;background:linear-gradient(90deg,#3d84c6,#297a2e);width:0%;transition:width .4s}
  .set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .set-card{
    background:#433a3a;border:1.5px solid var(--opt-border);border-radius:12px;padding:14px 12px;
    cursor:pointer;transition:transform .15s, box-shadow .15s, border-color .15s;text-align:left;
    font-family:inherit;color:var(--ink);
  }
  .set-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,50,80,.10);border-color:var(--title-blue)}
  .set-card .sn{font-weight:700;font-size:16px}
  .set-card .st{font-size:13px;color:var(--muted);margin-top:4px}
  .set-card.done{border-color:var(--ok);background:#f4fbf6}
  .set-card.partial{border-color:#e0a93b;background:#463106}
  .mini-bar{height:6px;background:#eef1f5;border-radius:4px;margin-top:8px;overflow:hidden}
  .mini-bar i{display:block;height:100%;background:var(--accent)}
  .reset-btn{
    background:transparent;border:1.5px solid var(--line);color:var(--muted);border-radius:8px;
    padding:6px 12px;font-family:inherit;font-size:13px;cursor:pointer;
  }
  .reset-btn:hover{color:var(--bad);border-color:var(--bad)}
  /* ---- Quiz ---- */
  .quiz-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;flex-wrap:wrap;gap:6px}
  .quiz-head h2{font-size:21px;font-weight:700}
  .qcount{color:var(--muted);font-size:15px;font-weight:500}
  .score-pill{font-size:13px;color:var(--accent);font-weight:600;background:#eef7ee;border:1px solid #c9e6c9;padding:3px 10px;border-radius:20px}
  .qnum{font-weight:700;margin-right:4px}
  .sentence{font-size:19px;line-height:1.55;margin-bottom:6px;color:var(--ink)}
  .blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink);margin:0 4px;font-weight:700;color:var(--title-blue);text-align:center}
  .bn-sent{font-size:16px;color:#4b5563;line-height:1.6;margin:4px 0 18px 0;font-family:'Hind Siliguri','Noto Sans Bengali','Sutonny MJ','SolaimanLipi','Nirmala UI',sans-serif}
  .options{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;align-items:center;gap:12px;text-align:left;
    background:var(--opt-bg);border:1.5px solid var(--opt-border);border-radius:11px;
    padding:13px 16px;font-family:inherit;font-size:16.5px;color:var(--ink);cursor:pointer;
    transition:background .15s,border-color .15s,transform .1s;width:100%;
  }
  .opt:hover:not(:disabled){background:var(--opt-hover);border-color:#b9c6d3}
  .opt:active:not(:disabled){transform:scale(.99)}
  .opt:disabled{cursor:default}
  .opt .letter{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#eef1f5;color:#4b5563;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
  }
  .opt .w{font-weight:600}
  .opt .bn{color:var(--muted);font-size:14.5px;font-family:'Hind Siliguri','Noto Sans Bengali','Sutonny MJ','SolaimanLipi','Nirmala UI',sans-serif}
  .opt.correct{background:var(--ok-bg);border-color:var(--ok);color:#14532d}
  .opt.correct .letter{background:var(--ok);color:#fff}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:#7f1d1d}
  .opt.wrong .letter{background:var(--bad);color:#fff}
  .opt.dim{opacity:.55}
  .feedback{margin-top:14px;font-size:15px;font-weight:600;min-height:22px}
  .feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
  .quiz-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap;gap:10px}
  .btn{
    border:none;border-radius:10px;padding:12px 22px;font-family:inherit;font-weight:700;font-size:15px;
    cursor:pointer;transition:background .15s,transform .1s;
  }
  .btn:active{transform:scale(.98)}
  .btn-back{background:var(--btn);color:#fff}
  .btn-back:hover{background:var(--btn-hover)}
  .btn-next{background:var(--title-blue);color:#fff;display:none}
  .btn-next:hover{background:#2f6fa8}
  .btn-next.show{display:inline-block}
  /* ---- Result ---- */
  .result{text-align:center;padding:10px 0 4px}
  .result .big{font-size:52px;font-weight:800;color:var(--accent)}
  .result .sub{color:var(--muted);font-size:16px;margin-bottom:20px}
  .result .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn-retry{background:var(--accent);color:#fff}
  .btn-retry:hover{background:#1f5f24}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
  .credit{text-align:center;color:var(--title-blue);font-size:14px;font-weight:700;margin-top:8px;letter-spacing:.3px}
  .credit-link{color:var(--title-blue);font-weight:800;text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s}
  .credit-link:hover,.credit-link:focus{border-bottom-color:var(--title-blue)}
  @media (max-width:520px){
    .card{padding:20px 16px 26px}
    .sentence{font-size:17px} .bn-sent{font-size:15px}
    .opt{font-size:15px;padding:11px 13px}
  }

  /* ---- Bengali ON/OFF toggle ---- */
  .bn-toggle{
    position:fixed; top:14px; right:14px; z-index:999;
    border:none; border-radius:999px; padding:9px 16px;
    font-family:'Baloo 2','Hind Siliguri','Noto Sans Bengali',sans-serif;
    font-weight:700; font-size:13.5px; cursor:pointer; color:#fff;
    background:var(--accent); box-shadow:0 4px 14px rgba(41,122,46,.35);
    transition:background .2s, transform .1s, box-shadow .2s;
    letter-spacing:.2px;
  }
  .bn-toggle:hover{transform:translateY(-1px)}
  .bn-toggle:active{transform:scale(.97)}
  .bn-toggle.off{background:var(--muted); box-shadow:0 4px 14px rgba(107,114,128,.35)}
  .bn-toggle .dot{
    display:inline-block; width:9px; height:9px; border-radius:50%;
    background:#fff; margin-right:7px; vertical-align:middle;
  }
  body.bn-off .bn,
  body.bn-off .bn-sent{ display:none !important; }
  @media (max-width:520px){
    .bn-toggle{ top:10px; right:10px; padding:7px 12px; font-size:12px }
  }
</style>
</head>
<body>
<button id="bnToggle" class="bn-toggle" type="button" aria-pressed="true" title="Toggle Bangla translation & meanings"><span class="dot"></span><span id="bnToggleLabel">Bangla On</span></button>

<div class="wrap">
  <div class="card">
    <div class="site-title">Word Smart 1 Games</div>
    <hr class="dash">

    <!-- SET LIST VIEW -->
    <div id="view-sets">
      <div class="sets-head">
        <h2>Practice Game Sets</h2>
        <button class="reset-btn" id="resetBtn">Reset all progress</button>
      </div>
      <div class="overall" id="overallText">0 / 0 words practiced</div>
      <div class="progress-track"><div class="progress-fill" id="overallBar"></div></div>
      <div class="set-grid" id="setGrid"></div>
    </div><br>
      <button class="btn btn-back" id="landingBtn" onclick="window.location.href='index.html'">
  ← Back to Home </button>

    <!-- QUIZ VIEW -->
    <div id="view-quiz" style="display:none">
      <div class="quiz-head">
        <h2 id="setTitle">Practice Game Set 1</h2>
        <div>
          <span class="score-pill" id="scorePill">Score: 0</span>
          <span class="qcount" id="qCount">Question 1 of 25</span>
        </div>
      </div>
      <div class="sentence" id="sentence"></div>
      <div class="bn-sent" id="bnSent"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="quiz-actions">
        <button class="btn btn-back" id="backBtn">Back to set List</button>
        <button class="btn btn-next" id="nextBtn">Next &rarr;</button>
      </div>
    </div>

    <!-- RESULT VIEW -->
    <div id="view-result" style="display:none">
      <div class="result">
        <div class="sub" id="resultSetName">Set 1 complete!</div>
        <div class="big" id="resultScore">0 / 25</div>

        <div class="actions">
          <button class="btn btn-retry" id="retryBtn">Retry this set</button>
          <button class="btn btn-back" id="backBtn2">Back to set List</button>
        </div>
      </div>
    </div>

    <div class="foot">825 words &middot; 33 sets of 25 &middot; progress saved in this browser</div>
</div>

<script>

(function(){
  var SETS = window.__WS_SETS__ || [];
  var LS_KEY = 'wordsmart1_progress_v1';
  var LETTERS = ['a','b','c','d','e'];
  var state = { view:'sets', setIdx:0, qIdx:0, locked:false };

  function loadProgress(){
    try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveProgress(p){ localStorage.setItem(LS_KEY, JSON.stringify(p)); }

  function setScore(setIdx){
    var p = loadProgress();
    var s = p[setIdx];
    if(!s) return {score:0, answered:0, done:false};
    return { score: s.score||0, answered: (s.answers? s.answers.filter(function(x){return x!=null}).length : 0), done: !!s.done };
  }

  function showView(v){
    state.view = v;
    document.getElementById('view-sets').style.display = v==='sets' ? '' : 'none';
    document.getElementById('view-quiz').style.display = v==='quiz' ? '' : 'none';
    document.getElementById('view-result').style.display = v==='result' ? '' : 'none';
  }

  function renderSets(){
    var grid = document.getElementById('setGrid');
    grid.innerHTML = '';
    var totalWords = 0, practiced = 0;
    SETS.forEach(function(set, i){
      var sc = setScore(i);
      totalWords += set.length;
      practiced += sc.answered;
      var card = document.createElement('button');
      card.className = 'set-card' + (sc.done ? ' done' : (sc.answered>0 ? ' partial' : ''));
      var status = sc.done ? ('Score '+sc.score+'/'+set.length) : (sc.answered>0 ? (sc.answered+'/'+set.length+' done') : 'Not started');
      var pct = set.length ? Math.round(100*sc.answered/set.length) : 0;
      card.innerHTML = '<div class="sn">Set '+(i+1)+'</div><div class="st">'+status+'</div>'+
        '<div class="mini-bar"><i style="width:'+pct+'%"></i></div>';
      card.addEventListener('click', function(){ startSet(i); });
      grid.appendChild(card);
    });
    document.getElementById('overallText').textContent = practiced + ' / ' + totalWords + ' words practiced';
    document.getElementById('overallBar').style.width = (totalWords? Math.round(100*practiced/totalWords):0) + '%';
  }

  function startSet(setIdx){
    state.setIdx = setIdx;
    var p = loadProgress();
    var s = p[setIdx];
    // find first unanswered
    var set = SETS[setIdx];
    var startQ = 0;
    if(s && s.answers){
      for(var i=0;i<set.length;i++){ if(s.answers[i]==null){ startQ = i; break; } }
      if(i===set.length) startQ = set.length-1;
    }
    state.qIdx = startQ;
    state.locked = false;
    document.getElementById('setTitle').textContent = 'Practice Game Set ' + (setIdx+1);
    showView('quiz');
    renderQuestion();
  }

  function currentItem(){ return SETS[state.setIdx][state.qIdx]; }

  function renderQuestion(){
    var item = currentItem();
    var set = SETS[state.setIdx];
    document.getElementById('qCount').textContent = 'Question ' + (state.qIdx+1) + ' of ' + set.length;
    var sc = setScore(state.setIdx);
    document.getElementById('scorePill').textContent = 'Score: ' + sc.score;
    // sentence with blank
    var sentEl = document.getElementById('sentence');
    sentEl.innerHTML = '<span class="qnum">'+(state.qIdx+1)+'.</span> ' +
      item.sentence.replace(/____/g, '<span class="blank">&nbsp;</span>');
    document.getElementById('bnSent').textContent = '(' + (item.bn_sentence || '') + ')';
    // options
    var optsEl = document.getElementById('options');
    optsEl.innerHTML = '';
    state.locked = false;
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';
    var nextBtn = document.getElementById('nextBtn');
    nextBtn.classList.remove('show');
    nextBtn.textContent = (state.qIdx === set.length-1) ? 'See result' : 'Next \u2192';

    // restore if already answered
    var p = loadProgress();
    var s = p[state.setIdx];
    var already = s && s.answers ? s.answers[state.qIdx] : undefined;

    item.options.forEach(function(opt, i){
      var btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="letter">'+LETTERS[i]+'</span><span>'+
        '<span class="w">'+escapeHtml(opt.word)+'</span> <span class="bn">('+escapeHtml(opt.bn||'')+')</span></span>';
      btn.addEventListener('click', function(){ choose(i, btn); });
      optsEl.appendChild(btn);
    });
    if(already !== undefined && already != null){
      state.locked = true;
      markAnswer(already, already === item.correct, already);
    }
  }

  function markAnswer(chosen, isCorrect, alreadyChosen){
    var item = currentItem();
    var btns = document.querySelectorAll('#options .opt');
    btns.forEach(function(b, i){
      b.disabled = true;
      if(i === item.correct){ b.classList.add('correct'); }
      else if(i === alreadyChosen){ b.classList.add('wrong'); }
      else { b.classList.add('dim'); }
    });
    var fb = document.getElementById('feedback');
    if(isCorrect){ fb.textContent = '\u2713 Correct! Well done.'; fb.className = 'feedback ok'; }
    else { fb.textContent = '\u2717 Not quite. The correct answer is ' + LETTERS[item.correct] + '. ' + item.options[item.correct].word + '.'; fb.className = 'feedback bad'; }
    document.getElementById('nextBtn').classList.add('show');
  }

  function choose(i, btn){
    if(state.locked) return;
    state.locked = true;
    var item = currentItem();
    var correct = (i === item.correct);
    var p = loadProgress();
    if(!p[state.setIdx]) p[state.setIdx] = {answers:[], score:0, done:false};
    var s = p[state.setIdx];
    while(s.answers.length < state.qIdx) s.answers.push(null);
    if(s.answers[state.qIdx] == null){
      s.answers[state.qIdx] = i;
      if(correct) s.score = (s.score||0) + 1;
    }
    saveProgress(p);
    markAnswer(i, correct, i);
    var sc = setScore(state.setIdx);
    document.getElementById('scorePill').textContent = 'Score: ' + sc.score;
  }

  function nextQuestion(){
    var set = SETS[state.setIdx];
    if(state.qIdx < set.length-1){
      state.qIdx++;
      renderQuestion();
    } else {
      // mark done
      var p = loadProgress();
      if(!p[state.setIdx]) p[state.setIdx] = {answers:[], score:0, done:false};
      p[state.setIdx].done = true;
      saveProgress(p);
      showResult();
    }
  }

  function showResult(){
    var set = SETS[state.setIdx];
    var sc = setScore(state.setIdx);
    document.getElementById('resultSetName').textContent = 'Practice Game Set ' + (state.setIdx+1) + ' complete!';
    document.getElementById('resultScore').textContent = sc.score + ' / ' + set.length;
    var pct = Math.round(100*sc.score/set.length);
    document.getElementById('resultPct').textContent = pct + '% correct' + (pct>=80?' — Excellent!':(pct>=50?' — Good, keep practicing.':' — Review and retry.'));
    showView('result');
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('backBtn').addEventListener('click', function(){ showView('sets'); renderSets(); });
  document.getElementById('backBtn2').addEventListener('click', function(){ showView('sets'); renderSets(); });
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  document.getElementById('retryBtn').addEventListener('click', function(){
    var p = loadProgress();
    delete p[state.setIdx];
    saveProgress(p);
    startSet(state.setIdx);
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    if(confirm('Reset ALL progress for every set? This cannot be undone.')){
      localStorage.removeItem(LS_KEY);
      renderSets();
    }
  });

  showView('sets');
  renderSets();
})();
</script>

  var KEY = 'wordsmart_bn_off';
  var btn = document.getElementById('bnToggle');
  var label = document.getElementById('bnToggleLabel');
  function apply(off){
    document.body.classList.toggle('bn-off', off);
    btn.classList.toggle('off', off);
    btn.setAttribute('aria-pressed', String(!off));
    label.textContent = off ? 'Bangla Off' : 'Bangla On';
  }
  var off = localStorage.getItem(KEY) === '1';
  apply(off);
  btn.addEventListener('click', function(){
    off = !off;
    localStorage.setItem(KEY, off ? '1' : '0');
    apply(off);
  });
})();
</script>
</body>

</html>
